<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Dropdown Z-Index</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simular o estilo do dropdown do Pagamentos.js */
        .dropdown-menu {
            position: absolute;
            right: 0;
            margin-top: 0.5rem;
            width: 14rem;
            background-color: rgb(30 41 59);
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid rgb(51 65 85);
            z-index: 110;
        }
        
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
        }
        
        .table-container {
            overflow-x: auto;
            overflow-y: visible;
        }
    </style>
</head>
<body class="bg-slate-900 text-white">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Teste Dropdown Menu Z-Index</h1>
        
        <!-- Simular a tabela de parcelas pendentes -->
        <div class="bg-slate-800 rounded-lg border border-slate-700">
            <div class="table-container">
                <table class="min-w-full divide-y divide-slate-700">
                    <thead class="bg-slate-700/50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">Cliente</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">Parcela</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">Valor</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700 bg-slate-800">
                        <tr class="hover:bg-slate-700/30 transition-colors" style="position: relative;">
                            <td class="px-6 py-4">Cliente Teste Dropdown</td>
                            <td class="px-6 py-4">1/3</td>
                            <td class="px-6 py-4">R$ 350,00</td>
                            <td class="px-6 py-4" style="position: relative; z-index: 10;">
                                <div class="relative" style="z-index: 50;">
                                    <button 
                                        id="menu-button"
                                        class="p-2 hover:bg-slate-600 rounded-lg transition-colors"
                                        onclick="toggleMenu()"
                                    >
                                        <svg class="w-5 h-5 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
                                            <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/>
                                        </svg>
                                    </button>
                                    
                                    <div id="dropdown-menu" class="dropdown-menu hidden">
                                        <div class="py-1">
                                            <button class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-white hover:bg-slate-700 transition-colors">
                                                <svg class="w-4 h-4 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
                                                    <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z"/>
                                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clip-rule="evenodd"/>
                                                </svg>
                                                <span>Registrar Pagamento</span>
                                            </button>
                                            
                                            <button class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-white hover:bg-slate-700 transition-colors">
                                                <svg class="w-4 h-4 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                                                    <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/>
                                                </svg>
                                                <span>Enviar WhatsApp</span>
                                            </button>
                                            
                                            <div class="border-t border-slate-600 my-1"></div>
                                            
                                            <button class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-400 hover:bg-red-500/10 transition-colors">
                                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                                                </svg>
                                                <span>Excluir Parcela</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Overlay (aparece quando menu está aberto) -->
        <div id="overlay" class="overlay hidden" onclick="closeMenu()"></div>
        
        <div class="mt-8 p-4 bg-slate-800 rounded-lg">
            <h2 class="text-xl font-bold mb-4">Informações de Debug</h2>
            <div id="debug-info" class="text-sm text-slate-300"></div>
        </div>
    </div>

    <script>
        let menuOpen = false;
        
        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            const overlay = document.getElementById('overlay');
            
            if (menuOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        }
        
        function openMenu() {
            const menu = document.getElementById('dropdown-menu');
            const overlay = document.getElementById('overlay');
            
            menu.classList.remove('hidden');
            overlay.classList.remove('hidden');
            menuOpen = true;
            
            updateDebugInfo();
        }
        
        function closeMenu() {
            const menu = document.getElementById('dropdown-menu');
            const overlay = document.getElementById('overlay');
            
            menu.classList.add('hidden');
            overlay.classList.add('hidden');
            menuOpen = false;
            
            updateDebugInfo();
        }
        
        function updateDebugInfo() {
            const menu = document.getElementById('dropdown-menu');
            const overlay = document.getElementById('overlay');
            const debugInfo = document.getElementById('debug-info');
            
            if (menuOpen) {
                const menuStyle = window.getComputedStyle(menu);
                const overlayStyle = window.getComputedStyle(overlay);
                const menuRect = menu.getBoundingClientRect();
                
                debugInfo.innerHTML = `
                    <strong>Menu Dropdown:</strong><br>
                    - Z-Index: ${menuStyle.zIndex}<br>
                    - Position: ${menuStyle.position}<br>
                    - Top: ${menuRect.top}px<br>
                    - Left: ${menuRect.left}px<br>
                    - Width: ${menuRect.width}px<br>
                    - Height: ${menuRect.height}px<br>
                    - Visível: ${menuRect.width > 0 && menuRect.height > 0}<br><br>
                    
                    <strong>Overlay:</strong><br>
                    - Z-Index: ${overlayStyle.zIndex}<br>
                    - Position: ${overlayStyle.position}<br>
                    - Background: ${overlayStyle.backgroundColor}<br><br>
                    
                    <strong>Status:</strong> Menu ${menuOpen ? 'ABERTO' : 'FECHADO'}
                `;
            } else {
                debugInfo.innerHTML = '<strong>Status:</strong> Menu FECHADO';
            }
        }
        
        // Inicializar debug info
        updateDebugInfo();
    </script>
</body>
</html>
