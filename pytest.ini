[pytest]
# Configuração do Pytest para o projeto

# Diretórios de teste
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py

# Padrão de classes de teste
python_classes = Test*

# Padrão de funções de teste
python_functions = test_*

# Markers personalizados
markers =
    integration: Testes de integração (API + DB)
    unit: Testes unitários
    slow: Testes lentos
    critical: Testes críticos que não podem falhar

# Opções padrão
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Asyncio
asyncio_mode = auto

# Cobertura de código (se pytest-cov estiver instalado)
# addopts = --cov=backend --cov-report=html --cov-report=term
