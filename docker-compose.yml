version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gestorcred_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: gestorcred
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - gestorcred_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/gestorcred --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestorcred_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=gestorcred
      - APP_URL=http://localhost:80
      - CORS_ORIGINS=http://localhost:80,http://127.0.0.1:80
    volumes:
      - backend_logs:/app/logs
      - backend_temp:/app/temp
    networks:
      - gestorcred_network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestorcred_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    networks:
      - gestorcred_network
    depends_on:
      - backend

networks:
  gestorcred_network:
    driver: bridge
    name: gestorcred_network

volumes:
  mongodb_data:
    name: gestorcred_mongodb_data
  mongodb_config:
    name: gestorcred_mongodb_config
  backend_logs:
    name: gestorcred_backend_logs
  backend_temp:
    name: gestorcred_backend_temp
