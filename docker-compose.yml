# Variáveis comuns aos processos Python (API + scheduler).
# Valores fixos de infra apenas. Segredos vêm de ./backend/.env via env_file.
x-common-env: &common-env
  MONGO_URL: mongodb://kredor_mongodb:27017/kredor?replicaSet=rs0
  DB_NAME: kredor
  ENVIRONMENT: production
  CORS_ORIGINS: https://kredor.com.br,https://www.kredor.com.br
  BASE_URL: https://kredor.com.br
  APP_URL: https://kredor.com.br

# Base compartilhada entre `backend` (API) e `scheduler` (jobs).
x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: kredor-backend
  restart: unless-stopped
  env_file:
    - ./backend/.env
  volumes:
    - backend_logs:/app/logs
    - backend_temp:/app/temp
    - ./backups:/app/backups
    # Anexos do suporte e backups importados (services/object_storage.py, modo local).
    - ./storage:/app/storage
  networks:
    - kredor_network
  depends_on:
    mongodb:
      condition: service_healthy

services:
  mongodb:
    image: mongo:7.0
    container_name: kredor_mongodb
    restart: unless-stopped
    # Replica set de 1 nó: habilita transações multi-documento (caminhos de dinheiro).
    # Inicializar UMA vez após o primeiro `up`:
    #   docker exec kredor_mongodb mongosh --quiet --eval \
    #     'rs.initiate({_id:"rs0", members:[{_id:0, host:"kredor_mongodb:27017"}]})'
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: kredor
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - kredor_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 2G
    healthcheck:
      test: mongosh --quiet --eval 'rs.status().myState === 1' | grep -q true
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # API HTTP. NÃO roda o scheduler (RUN_SCHEDULER=false) — senão cada worker
  # gunicorn subiria o seu próprio APScheduler e os jobs rodariam em duplicidade.
  backend:
    <<: *backend-common
    container_name: kredor_backend
    environment:
      <<: *common-env
      RUN_SCHEDULER: "false"
    networks:
      - kredor_network
      - gateway-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Instância única do scheduler de jobs (APScheduler). Processo dedicado,
  # sem porta HTTP. Publica heartbeat em /tmp/scheduler_heartbeat.
  scheduler:
    <<: *backend-common
    container_name: kredor_scheduler
    command: ["python", "-m", "scheduler_runner"]
    environment:
      <<: *common-env
      RUN_SCHEDULER: "true"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/scheduler_heartbeat -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: https://kredor.com.br
        REACT_APP_TURNSTILE_SITE_KEY: 0x4AAAAAAEtfVxigc166FEme
    image: kredor-frontend
    container_name: kredor_frontend
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_URL=https://kredor.com.br
    networks:
      - kredor_network
      - gateway-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - backend

networks:
  kredor_network:
    driver: bridge
    name: kredor_network
  gateway-network:
    external: true

volumes:
  mongodb_data:
    name: kredor_mongodb_data
  mongodb_config:
    name: kredor_mongodb_config
  backend_logs:
    name: kredor_backend_logs
  backend_temp:
    name: kredor_backend_temp
