        <!-- Schema.org: FAQPage -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Como funciona um sistema de gestão de empréstimos?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "O GestorCred permite controlar clientes, calcular juros automaticamente (simples ou compostos), gerenciar parcelas, enviar cobranças via PIX e WhatsApp e acompanhar a inadimplência em tempo real, com dashboard financeiro e relatórios."
              }
            },
            {
              "@type": "Question",
              "name": "Como calcular juros de empréstimos automaticamente?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "O GestorCred calcula automaticamente juros simples e compostos com base na taxa, prazo e valor principal, gerando todas as parcelas e aplicando multa e juros de mora em pagamentos atrasados."
              }
            },
            {
              "@type": "Question",
              "name": "É possível cobrar empréstimos via PIX pelo sistema?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. O GestorCred gera links de pagamento PIX e permite o envio via WhatsApp, detectando pagamentos e atualizando o status das parcelas em tempo real."
              }
            },
            {
              "@type": "Question",
              "name": "Como funciona a régua de cobrança automática via WhatsApp?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A régua de cobrança envia lembretes e cobranças automáticas via WhatsApp antes e depois do vencimento, com proteção anti-spam e mensagens personalizáveis, incluindo link de pagamento PIX."
              }
            },
            {
              "@type": "Question",
              "name": "Posso testar o sistema gratuitamente?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Oferecemos teste grátis por 7 dias, sem cartão de crédito, com acesso às funcionalidades essenciais de gestão de empréstimos."
              }
            }
          ]
        }
