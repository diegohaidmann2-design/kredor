# Configuração Nginx para React SPA

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache de assets estáticos (exceto env-config.js)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        if ($request_uri ~* "env-config.js") {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
        if ($request_uri !~* "env-config.js") {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        access_log off;
    }

    # SPA Fallback - todas as rotas vão para index.html
    # Atrás do gateway/Cloudflare o nginx não sabe que a requisição veio em https:
    # redirecionamento relativo evita devolver http:// no Location.
    absolute_redirect off;

    location / {
        # $uri/index.html antes de $uri/: serve a página pré-renderizada direto, com 200.
        # Sem isso o nginx redireciona /pagina para /pagina/ (301) e, atrás do gateway, monta
        # a URL com o próprio esquema — devolvia Location: http:// numa requisição https.
        try_files $uri $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Sitemap dinâmico servido pelo backend (lastmod real + posts de blog).
    location = /sitemap.xml {
        proxy_pass http://backend:8001/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
